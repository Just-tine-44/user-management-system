services:
  - name: juarez-final-deployment-project
    type: web
    env: node
    plan: free
    rootDir: Node-js-MySQL-BoilerPlate
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "*,http://localhost:4200"